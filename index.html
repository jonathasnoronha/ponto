<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ponto</title>
<meta name="description" content="Cartão de ponto: horas trabalhadas, extras e saldo por semana e por mês.">
<meta name="theme-color" content="#8E2456">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ponto">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: cartão de ponto de bolso — uma coluna, carimbos de horário em mono, navegação fixa embaixo */
:root{
  --bg:#EDF0F3; --card:#FFFFFF; --ink:#18202A; --muted:#5B6675; --line:#D7DDE4;
  --accent:#B0336A; --accent-ink:#FFFFFF; --soft:#F6E7EE;
  --pos:#1F7A4D; --pos-soft:#E2F2E9; --neg:#B3261E; --neg-soft:#FBE7E5; --hol:#8A5A00; --hol-soft:#FBF0D9;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161C; --card:#1A2129; --ink:#E8EDF2; --muted:#9AA6B4; --line:#2C3642;
  --accent:#E7739F; --accent-ink:#1E0E16; --soft:#3A2230;
  --pos:#5CC48D; --pos-soft:#16301F; --neg:#F08A82; --neg-soft:#3A1C1A; --hol:#E8B54A; --hol-soft:#33290F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161C; --card:#1A2129; --ink:#E8EDF2; --muted:#9AA6B4; --line:#2C3642;
  --accent:#E7739F; --accent-ink:#1E0E16; --soft:#3A2230;
  --pos:#5CC48D; --pos-soft:#16301F; --neg:#F08A82; --neg-soft:#3A1C1A; --hol:#E8B54A; --hol-soft:#33290F; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px calc(96px + env(safe-area-inset-bottom, 0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Topo */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.top h1 span{color:var(--accent)}
.top-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"]::before{background:var(--pos)}
.sync[data-s="salvando"]::before,.sync[data-s="carregando"]::before{background:var(--hol)}
.sync[data-s="erro"]::before,.sync[data-s="offline"]::before{background:var(--neg)}
.sync[data-s="erro"]{color:var(--neg)}

/* Hoje */
.today-date{font-size:15px;color:var(--muted);font-weight:600}
.clock{font-family:var(--f-mono);font-size:52px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.clock small{font-size:22px;color:var(--muted)}
.punch{width:100%;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 0 color-mix(in srgb, var(--accent) 55%, black)}
.punch:active{transform:translateY(4px);box-shadow:0 2px 0 0 color-mix(in srgb, var(--accent) 55%, black)}
.punch b{font-family:var(--f-display);font-size:22px;font-weight:800}
.punch span{font-size:14px;opacity:.9}
.punch[disabled]{opacity:.55;transform:none;box-shadow:none;cursor:default}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{display:flex;flex-direction:column;gap:4px;border:1px dashed var(--line);border-radius:10px;padding:10px}
.slot label{font-size:12px;color:var(--muted);font-weight:600}
.slot.next{border:1.5px solid var(--accent);background:var(--soft)}
input[type=time],input[type=number],input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.slot input{font-family:var(--f-mono);font-size:20px;font-weight:600;padding:6px 8px;background:transparent;border-color:transparent}
.slot input:focus{border-color:var(--line);background:var(--bg)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-mono);font-size:19px;font-weight:600}
.kpi span{font-size:12px;color:var(--muted)}

/* chips */
.chip{display:inline-block;font-family:var(--f-mono);font-size:13px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.pos{background:var(--pos-soft);color:var(--pos)}
.chip.neg{background:var(--neg-soft);color:var(--neg)}
.chip.zero{background:var(--bg);color:var(--muted)}
.chip.hol{background:var(--hol-soft);color:var(--hol)}
.chip.warn{background:var(--neg-soft);color:var(--neg);font-family:var(--f-body);font-size:12px}
.chip.info{background:var(--soft);color:var(--accent);font-family:var(--f-body);font-size:12px}

/* Mês */
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h2{font-size:20px;font-weight:800}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:18px;display:grid;place-items:center}
.week{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.week-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.week-h .eyebrow{letter-spacing:.06em}
.dia{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 14px}
.dia:last-child{border-bottom:0}
.dia:hover{background:var(--bg)}
.dd{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.dd b{font-family:var(--f-mono);font-size:18px}
.dd small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.dia.hoje .dd b{color:var(--accent)}
.mk{font-family:var(--f-mono);font-size:13px;color:var(--ink);min-width:0;display:flex;flex-direction:column}
.mk .lbl{font-family:var(--f-body);font-weight:600}
.mk .ob{font-family:var(--f-body);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.res .tt{font-family:var(--f-mono);font-size:14px;font-weight:600}
.dia.fut{opacity:.55}
.dia.fer{background:color-mix(in srgb, var(--hol-soft) 60%, transparent)}

/* Resumo */
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big .card{padding:14px}
.big b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:600;margin-top:2px}
.saldo{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.saldo b{font-size:32px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tablebox{overflow-x:auto}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.wide{width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}

/* Ajustes */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.jornada{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.jornada .field input{font-family:var(--f-mono)}
.fer-list{display:flex;flex-direction:column;gap:6px}
.fer-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.banner{background:var(--soft);border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{background:var(--neg-soft);border-color:var(--neg)}
details summary{cursor:pointer;font-weight:700}
.help{font-size:14px;color:var(--muted)}
.help ol{padding-left:20px;margin:8px 0 0}

/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px);z-index:20}
nav.tabs button{background:transparent;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* Editor */
dialog{border:0;border-radius:18px;padding:0;background:var(--card);color:var(--ink);width:min(520px, calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(10,14,20,.5)}
.ed{padding:18px;display:flex;flex-direction:column;gap:14px}
.ed h3{font-size:20px}
.tipos{display:flex;flex-wrap:wrap;gap:6px}
.tipos button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.tipos button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ed .slots input{font-family:var(--f-mono);font-size:18px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 2px 2px;text-align:left}
.switch-row>span:first-child{display:flex;flex-direction:column;font-weight:700}
.switch-row small{font-weight:500;font-size:13px;color:var(--muted)}
.switch{position:relative;flex:none;width:51px;height:31px;border-radius:999px;background:var(--line);transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.switch-row[aria-checked="true"] .switch{background:var(--pos)}
.switch-row[aria-checked="true"] .switch::after{transform:translateX(20px)}
body.ro .switch-row{pointer-events:none;opacity:.55}
.tsel{display:flex;align-items:center;gap:4px;min-width:0}
.tsel b{font-family:var(--f-mono);color:var(--muted)}
.tsel select{flex:1;min-width:0;width:auto;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:16px;text-align:center;text-align-last:center;padding:6px 4px;-webkit-appearance:none;appearance:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.tsel.big select{font-size:20px;padding:8px 4px}
body.ro .wrap select, body.ro dialog select, body.ro .wrap input, body.ro .wrap textarea, body.ro .punch, body.ro .tipos button, body.ro [data-act="ed-clear"]{pointer-events:none;opacity:.55}
body.ro dialog input{pointer-events:none;opacity:.55}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* login */
.login{max-width:420px;margin:0 auto;padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));padding-block:40px 40px;display:flex;flex-direction:column;gap:18px}
.login .brand{display:flex;align-items:center;gap:14px}
.login .brand img{width:64px;height:64px;border-radius:15px;box-shadow:0 6px 18px rgba(80,15,45,.25)}
.login h1{font-size:30px;font-weight:800}
.login .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.login .seg button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:700;color:var(--muted)}
.login .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.login form{display:flex;flex-direction:column;gap:12px}
.login input{font-size:16px;padding:12px}
.login .erro{color:var(--neg);font-weight:600;font-size:14px}
.login .ok{color:var(--pos);font-weight:600;font-size:14px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;padding:4px 0;align-self:flex-start}
.boot{min-height:60vh;display:grid;place-items:center;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<div class="boot" id="boot">Carregando…</div>

<div class="login" id="login" hidden>
  <div class="brand"><img src="icons/icon-192.png" alt=""><div><h1>Ponto</h1><span class="muted">Seu cartão de ponto no celular</span></div></div>
  <div class="seg" role="group" aria-label="Modo">
    <button type="button" id="m-entrar" aria-pressed="true">Entrar</button>
    <button type="button" id="m-criar" aria-pressed="false">Criar conta</button>
  </div>
  <form id="f-login" novalidate>
    <div class="field" id="w-nome" hidden><label for="l-nome">Seu nome</label><input id="l-nome" type="text" autocomplete="name" placeholder="ex.: Jessika"></div>
    <div class="field"><label for="l-email">E-mail</label><input id="l-email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" required></div>
    <div class="field"><label for="l-senha">Senha</label><input id="l-senha" type="password" autocomplete="current-password" required minlength="6"></div>
    <span class="erro" id="l-erro" hidden></span>
    <span class="ok" id="l-ok" hidden></span>
    <button class="btn primary wide" id="l-btn" type="submit">Entrar</button>
    <button class="linkbtn" id="l-esqueci" type="button">Esqueci minha senha</button>
  </form>
</div>

<div id="shell" hidden>


<div class="wrap" id="app">
  <header class="top">
    <h1>Ponto<span id="hdr-nome"></span></h1>
    <div class="top-r"><span class="eyebrow" id="hdr-sub">CLT · 44h</span><span class="sync" id="sync" data-s="local">Só neste aparelho</span></div>
  </header>
  <div id="admin-bar" class="banner" hidden style="margin-top:12px"></div>
  <div id="ro-warn" class="banner warn" hidden style="margin-top:12px">
    <span class="small"><b>Esta conta não tem permissão para editar estes registros.</b></span>
  </div>
  <div id="storage-warn" class="banner warn" hidden style="margin-top:12px">
    <span class="small">Este navegador não está guardando os dados. Abra o link no Chrome ou Safari (fora do modo anônimo) e use "Copiar backup" em Ajustes.</span>
  </div>

  <section id="v-hoje" class="stack" style="margin-top:16px"></section>
  <section id="v-mes" class="stack" style="margin-top:16px" hidden></section>
  <section id="v-resumo" class="stack" style="margin-top:16px" hidden></section>
  <section id="v-ajustes" class="stack" style="margin-top:16px" hidden></section>
</div>

<nav class="tabs" aria-label="Seções">
  <button data-tab="hoje" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hoje</button>
  <button data-tab="mes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Mês</button>
  <button data-tab="resumo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Resumo</button>
  <button data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</nav>

<dialog id="ed"><div class="ed" id="ed-body"></div></dialog>
<div class="toast" id="toast" hidden></div>


</div>
<script src="app.js"></script>
<script type="module" src="firebase.js"></script>
</body>
</html>
